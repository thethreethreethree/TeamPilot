<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Browser-tab favicon variant. The canonical brand logo at
       elostate-logo.svg has the ELOSTATE wordmark below the bulb,
       which is unreadable at 16px. This is a bulb-only crop with a
       matte-black rounded chip so the amber stroke holds contrast
       in both light and dark browser chrome.
       For PWA + Apple touch icon, use the full canonical logo
       (public/icon-maskable.svg, src/app/apple-icon.svg). -->
  <rect width="512" height="512" rx="80" fill="#09090B"/>
  <g fill="none" stroke="#FACC15" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200 340 Q 145 295 145 215 Q 145 110 256 110 Q 367 110 367 215 Q 367 295 312 340 L 312 358 L 200 358 Z"/>
    <line x1="210" y1="380" x2="302" y2="380"/>
    <line x1="215" y1="402" x2="297" y2="402"/>
    <path d="M 232 420 Q 256 442 280 420"/>
    <circle cx="250" cy="220" r="42"/>
    <path d="M 208 222 L 290 222 Q 302 222 302 236 Q 302 252 284 250"/>
  </g>
</svg>
