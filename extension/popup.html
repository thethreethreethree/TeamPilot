<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* C.A.R.E palette, mirrored from src/lib/design/tokens.ts (ember + ink). Dark by default (the app default). */
  :root {
    --ember-300: #FDE047; --ember-400: #FACC15; --ember-500: #EAB308; --ember-600: #CA8A04;
    --ink-200: #E4E4E7; --ink-400: #A1A1AA; --ink-500: #71717A; --ink-600: #52525B;
    --ink-700: #3F3F46; --ink-800: #27272A; --ink-900: #18181B; --ink-950: #09090B;
    --text: var(--ink-200); --muted: var(--ink-400); --bg: var(--ink-950); --surface: var(--ink-900);
    --border: var(--ink-800);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px; min-height: 220px; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.5;
  }
  .hdr { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .hdr img { width: 22px; height: 22px; border-radius: 5px; }
  .hdr .name { font-weight: 800; letter-spacing: -0.01em; }
  .hdr .tag { font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace; margin-left: auto; }
  .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-600); flex-shrink: 0; }
  .status-dot.on { background: #16a34a; }
  .status-dot.trial { background: var(--ember-400); }
  .muted { color: var(--muted); font-size: 12px; }
  .consent { font-size: 11px; color: var(--muted); background: rgba(250,204,21,0.06); border: 1px solid rgba(250,204,21,0.2); border-radius: 8px; padding: 8px 10px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--ink-800); color: var(--text); padding: 8px 10px; text-align: left; transition: border-color .15s, background .15s; }
  button:hover:not(:disabled) { border-color: var(--ink-600); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--ember-400); color: #09090B; border-color: var(--ember-400); font-weight: 700; text-align: center; }
  button.primary:hover:not(:disabled) { background: var(--ember-500); }
  .tool .t-label { font-weight: 600; font-size: 12px; }
  .tool .t-desc { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }
  .tool .soon { font-size: 9px; color: var(--ember-300); text-transform: uppercase; letter-spacing: .05em; }
  .result { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .result .rlabel { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--ember-300); font-weight: 700; margin-bottom: 4px; }
  input[type=text], input[type=password] { width: 100%; background: var(--ink-950); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 12px; }
  a { color: var(--ember-400); text-decoration: none; }
  .hide { display: none !important; }
  .foot { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 10px; color: var(--ink-600); display: flex; justify-content: space-between; align-items: center; }
  .link-btn { background: none; border: none; color: var(--ember-400); padding: 0; font-size: 10px; cursor: pointer; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--ink-600); border-top-color: var(--ember-400); border-radius: 50%; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="hdr">
    <img src="icons/icon48.png" alt="" />
    <span class="name">C.A.R.E</span>
    <span class="tag">extension · v0.1</span>
  </div>

  <!-- Not connected -->
  <div id="connect" class="body hide">
    <div class="row"><span class="status-dot"></span><span class="muted">Not connected</span></div>
    <p class="muted">Connect your C.A.R.E account to use the tools. It stays your coach, grounded in your own workspace.</p>
    <button id="signInBtn" class="primary" type="button">Sign in to C.A.R.E</button>
    <details>
      <summary class="muted" style="cursor:pointer; font-size:11px;">Developer connect (paste session token)</summary>
      <div class="row" style="margin-top:8px;">
        <input id="tokenInput" type="password" placeholder="Supabase access token" />
      </div>
      <button id="tokenSaveBtn" type="button" style="margin-top:6px; width:100%; text-align:center;">Connect with token</button>
    </details>
  </div>

  <!-- Connected -->
  <div id="tools" class="body hide">
    <div class="row">
      <span id="statusDot" class="status-dot on"></span>
      <span id="statusText" class="muted">Connected</span>
      <button id="disconnectBtn" class="link-btn" type="button" style="margin-left:auto;">Disconnect</button>
    </div>
    <div class="consent">We only read the text you have <b>selected</b> on the page. It's processed to help you and <b>not stored</b>.</div>
    <button id="readSelBtn" class="primary" type="button">Read my selected text</button>
    <div id="selInfo" class="muted hide"></div>
    <div class="tools" id="toolGrid"></div>
    <div id="result" class="result hide"></div>
  </div>

  <div class="foot">
    <span id="apiLabel"></span>
    <button id="settingsBtn" class="link-btn" type="button">Settings</button>
  </div>

  <!-- Settings -->
  <div id="settings" class="body hide">
    <label class="muted" for="apiInput">API base URL</label>
    <input id="apiInput" type="text" placeholder="https://elostate.com" />
    <button id="apiSaveBtn" type="button" style="text-align:center;">Save</button>
    <button id="settingsBackBtn" class="link-btn" type="button">← Back</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
