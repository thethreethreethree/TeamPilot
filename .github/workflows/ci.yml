# CI for ELOSTATE — runs typecheck, lint, rls:audit, theme:audit, tests, and `next build`
# on every PR and push to main (mirrors the `check` npm script, plus a production build).
# Closes audit Tier 2 #10 (no CI) from docs/AUDIT-2026-06-02.md.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The project's own `check` script gates on these two static audits, but CI was skipping
      # them. Both are pure static analysis (rls:audit parses supabase/migrations/*.sql; theme:audit
      # scans src) — no DB, no secrets, CI-safe. rls:audit is the important one: it makes the
      # RLS-policy-per-operation gap (the DELETE-silently-affects-0-rows class) impossible to ship,
      # so a new table missing a write policy fails the PR instead of shipping a silent auth hole.
      - name: RLS policy audit
        run: npm run rls:audit

      - name: Theme-leak audit
        run: npm run theme:audit

      # Invariant audit — the class of bug this codebase has ALREADY shipped once and fixed only in
      # prose. On 2026-07-14 a cross-tenant view leak recurred 19 times because the fix (0052) lived in
      # a migration and never in a check, and rls:audit reported green throughout. A lesson recorded
      # only in a doc survives exactly as long as someone remembers to read the doc. This gate holds the
      # two that were still unguarded: every CSV export routes through csvSafe (CWE-1236 formula
      # injection), and no finance route uses the service-role client (which bypasses RLS entirely —
      # how the CRM vendor hole happened).
      - name: Invariant audit
        run: npm run invariant:audit

      - name: Test
        run: npm run test

      # `next build` catches deploy-breaking errors that typecheck + lint pass but Vercel would
      # fail on: App-Router server/client boundary violations, bad dynamic() imports, and
      # build-time module-evaluation failures. Verified CI-safe with no Supabase secrets — the
      # client factories fall back to "" (src/lib/supabase/config.ts) and dynamic routes render
      # on demand, so the build needs no live DB. Without this step those errors reach production.
      #
      # This runs with NO secrets, so it catches failures a WITH-secrets build (local `npm run build`
      # or Vercel) can't — a module throwing at build-time on a missing key, a page prerendering
      # without a Suspense boundary. To reproduce THIS step locally before pushing: `npm run build:ci`
      # (it hides .env.local + strips secret vars, then restores them). This divergence kept CI
      # chronically red + unnoticed for weeks (2026-08-04) — see docs/FOUNDER-ACTION-QUEUE.md "CI".
      - name: Build
        run: npm run build

      # Guard against a SILENT knowledge-base-loss regression: the Coach + Sales coach read their KBs at RUNTIME via
      # readFileSync(join(process.cwd(),"docs",...)). Next's file-tracing currently bundles docs/ into the standalone
      # output (empirically verified 2026-08-25 — both files land in .next/standalone/docs/), but it's an AUTO-traced
      # DYNAMIC path: a Next/nft upgrade could stop tracing it, silently leaving the coach with an EMPTY KB (the loader
      # falls back to "" with only a console.error). The unit tests read the file directly, so they CANNOT catch a
      # bundling regression — this post-build assertion can, and fails CI before such a build ever reaches production.
      - name: Verify knowledge bases are bundled into the standalone output
        run: |
          test -f .next/standalone/docs/COACH_KNOWLEDGE_BASE.md || { echo "::error::COACH_KNOWLEDGE_BASE.md is NOT bundled into .next/standalone/docs — the Coach would run with an EMPTY knowledge base in production. Add outputFileTracingIncludes for it in next.config.ts."; exit 1; }
          test -f .next/standalone/docs/SALES_KNOWLEDGE_BASE.md || { echo "::error::SALES_KNOWLEDGE_BASE.md is NOT bundled into .next/standalone/docs — the sales coach would run with an EMPTY knowledge base in production. Add outputFileTracingIncludes for it in next.config.ts."; exit 1; }
          echo "Both knowledge bases are bundled into the standalone output."
