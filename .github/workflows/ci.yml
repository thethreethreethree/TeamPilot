# CI for ELOSTATE — runs typecheck, lint, rls:audit, theme:audit, tests, and `next build`
# on every PR and push to main (mirrors the `check` npm script, plus a production build).
# Closes audit Tier 2 #10 (no CI) from docs/AUDIT-2026-06-02.md.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The project's own `check` script gates on these two static audits, but CI was skipping
      # them. Both are pure static analysis (rls:audit parses supabase/migrations/*.sql; theme:audit
      # scans src) — no DB, no secrets, CI-safe. rls:audit is the important one: it makes the
      # RLS-policy-per-operation gap (the DELETE-silently-affects-0-rows class) impossible to ship,
      # so a new table missing a write policy fails the PR instead of shipping a silent auth hole.
      - name: RLS policy audit
        run: npm run rls:audit

      - name: Theme-leak audit
        run: npm run theme:audit

      # Invariant audit — the class of bug this codebase has ALREADY shipped once and fixed only in
      # prose. On 2026-07-14 a cross-tenant view leak recurred 19 times because the fix (0052) lived in
      # a migration and never in a check, and rls:audit reported green throughout. A lesson recorded
      # only in a doc survives exactly as long as someone remembers to read the doc. This gate holds the
      # two that were still unguarded: every CSV export routes through csvSafe (CWE-1236 formula
      # injection), and no finance route uses the service-role client (which bypasses RLS entirely —
      # how the CRM vendor hole happened).
      - name: Invariant audit
        run: npm run invariant:audit

      - name: Test
        run: npm run test

      # `next build` catches deploy-breaking errors that typecheck + lint pass but Vercel would
      # fail on: App-Router server/client boundary violations, bad dynamic() imports, and
      # build-time module-evaluation failures. Verified CI-safe with no Supabase secrets — the
      # client factories fall back to "" (src/lib/supabase/config.ts) and dynamic routes render
      # on demand, so the build needs no live DB. Without this step those errors reach production.
      - name: Build
        run: npm run build

  # Migration-execution gate — proposed 2026-07-20 (docs/proposals/ci-migration-gate.md). Closes the gap
  # that let 0175 (a `column r.memo does not exist` bug) pass every gate above and fail only on live apply:
  # nothing here parses SQL. This job applies EVERY migration to a throwaway database from scratch, so a bad
  # column/table/view reference fails the PR instead of the founder's next `db:apply`.
  #
  # It uses the Supabase CLI, NOT a bare postgres container — 110 of 187 migrations reference the `auth`
  # schema (auth.uid/auth.users) + 29 reference `storage`, which vanilla Postgres does not have; the CLI's
  # local stack provides them and `supabase db reset` replays supabase/migrations/*.sql in order.
  #
  # SHIPPED NON-BLOCKING ON PURPOSE (continue-on-error: true). This job is UNVERIFIED — it was authored
  # without a way to run Docker/Actions locally; open questions (does `db reset` need a seed? is `db start`
  # enough? the storage.* deps? cold-start cost) are listed in the proposal and only a real run answers them.
  # Let it go green on a few real PRs, THEN remove continue-on-error to make it blocking. Merging it blocking
  # while any of those questions bites would red-wall every PR — the opposite of helpful.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        # Boots Postgres + the auth/storage schemas the migrations depend on. Docker is available on
        # ubuntu-latest runners. If this proves heavier than needed, `supabase db start` alone may suffice.
        run: supabase start

      - name: Apply all migrations from scratch
        # Replays supabase/migrations/*.sql in order against the fresh local DB; nonzero exit on any error.
        run: supabase db reset

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
